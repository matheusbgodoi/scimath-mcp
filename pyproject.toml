[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scimath-mcp"
version = "0.1.0"
description = "A secure, unit-aware scientific computing MCP server for engineering and science"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matheus Barboza de Godoi" }]
keywords = ["mcp", "scientific-computing", "engineering", "sympy", "pint"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "mcp==2.0.0",
  "mpmath>=1.3,<1.4",
  "numpy>=2.5,<3",
  "pint>=0.25,<1",
  "pydantic>=2.12,<3",
  "scipy>=1.18,<2",
  "sympy>=1.14,<2",
  "uncertainties>=3.2,<4",
]

[project.urls]
Homepage = "https://github.com/matheusbgodoi/scimath-mcp"
Documentation = "https://github.com/matheusbgodoi/scimath-mcp/tree/main/docs"
Issues = "https://github.com/matheusbgodoi/scimath-mcp/issues"
Source = "https://github.com/matheusbgodoi/scimath-mcp"

[project.scripts]
scimath-mcp = "scimath_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=9.1,<10",
  "ruff>=0.16,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
